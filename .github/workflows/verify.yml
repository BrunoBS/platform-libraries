name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'poc/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress clean verify

      - name: Verify library Java namespace
        run: python3 scripts/verify-library-namespace.py

      - name: Verify Platform namespace
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'com\.empresa\.platform|br\.com\.portalmanager\.core' -- ':!docs/**'; then
            echo "Legacy Maven/Java namespace found outside historical documentation."
            exit 1
          fi
          if git ls-files | grep -Eq 'com/empresa/platform|br/com/portalmanager/core'; then
            echo "Legacy Java package path found."
            exit 1
          fi
          if git grep -nE 'platform-logging|platform-test-support|platform\.logging' -- ':!docs/**' ':!.github/workflows/verify.yml'; then
            echo "Legacy module/config naming found outside historical documentation."
            exit 1
          fi
          if git ls-files | grep -Eq 'modules/platform-logging|modules/platform-test-support'; then
            echo "Legacy module path found."
            exit 1
          fi

      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)\.flattened-pom\.xml$'; then
            echo "Generated flattened POM must not be tracked by Git."
            exit 1
          fi

      - name: Verify release train metadata
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(sed -n 's/^-Drevision=//p' .mvn/maven.config)"
          test -n "$REVISION"
          test -f platform-libraries-bom/.flattened-pom.xml
          test -f platform-parent/.flattened-pom.xml
          if grep -nH '\${revision}' platform-parent/.flattened-pom.xml; then
            echo "Unresolved revision found in the flattened parent POM."
            exit 1
          fi
          grep -q "<version>$REVISION</version>" platform-libraries-bom/.flattened-pom.xml
          if grep -nH '\${revision}' platform-libraries-bom/.flattened-pom.xml; then
            echo "Unresolved revision found in the flattened BOM."
            exit 1
          fi
          if find modules -name .flattened-pom.xml -print0 | xargs -0 grep -nH '\${revision}'; then
            echo "Unresolved revision found in flattened module POMs."
            exit 1
          fi
