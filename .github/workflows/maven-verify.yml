name: Maven Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Maven Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout platform-libraries
        uses: actions/checkout@v5
        with:
          path: platform-libraries

      - name: Checkout platform-build
        uses: actions/checkout@v5
        with:
          repository: BrunoBS/platform-build
          path: platform-build
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            platform-build/**/pom.xml
            platform-libraries/**/pom.xml

      - name: Create CI reactor
        run: |
          cat > ci-pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.empresa.platform.ci</groupId>
              <artifactId>platform-ci-reactor</artifactId>
              <version>1.0.0</version>
              <packaging>pom</packaging>
              <modules>
                  <module>platform-build/platform-dependencies</module>
                  <module>platform-build/platform-parent</module>
                  <module>platform-libraries</module>
              </modules>
          </project>
          EOF

      - name: Run Maven verify
        run: mvn -B -ntp -f ci-pom.xml clean verify
