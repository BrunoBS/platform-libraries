name: Namespace migration

on:
  push:
    branches:
      - refactor/portalmanager-namespace

permissions:
  contents: write
  packages: read

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Migrate namespace
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            target="${path//com\/empresa\/platform/br\/com\/portalmanager\/core}"
            mkdir -p "$(dirname "$target")"
            git mv "$path" "$target"
          done < <(git ls-files | grep 'com/empresa/platform' || true)

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            sed -i 's/com\.empresa\.platform/br.com.portalmanager.core/g' "$file"
          done < <(git grep -Il 'com\.empresa\.platform' || true)

          if git grep -n 'com\.empresa\.platform'; then
            echo "Old namespace remains in tracked text files."
            exit 1
          fi

          if git ls-files | grep -q 'com/empresa/platform'; then
            echo "Old namespace remains in tracked paths."
            exit 1
          fi

      - name: Verify migrated reactor
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress clean verify

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(foundation): migrar namespace para portalmanager"
          git push origin HEAD:refactor/portalmanager-namespace
