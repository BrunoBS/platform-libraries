name: Package migration probe

on:
  push:
    branches:
      - refactor/consolidate-foundation-repositories

permissions:
  contents: read

jobs:
  deploy-platform-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Deploy platform-dependencies to consolidated registry
        env:
          GITHUB_PUBLISH_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: mvn --settings .github/maven-publish-settings.xml --batch-mode --no-transfer-progress -pl platform-dependencies clean deploy
