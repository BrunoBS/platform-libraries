name: Fresh package resolution probe

on:
  push:
    branches:
      - refactor/consolidate-foundation-repositories

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve structural artifacts from empty Maven repository
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FRESH_REPO="${RUNNER_TEMP}/foundation-m2"
          rm -rf "${FRESH_REPO}"
          mvn --settings .github/maven-settings.xml -Dmaven.repo.local="${FRESH_REPO}" --batch-mode --no-transfer-progress dependency:get -Dartifact=com.empresa.platform:platform-dependencies:1.0.3:pom -Dtransitive=false
          mvn --settings .github/maven-settings.xml -Dmaven.repo.local="${FRESH_REPO}" --batch-mode --no-transfer-progress dependency:get -Dartifact=com.empresa.platform:platform-parent:1.1.0:pom -Dtransitive=false
          mvn --settings .github/maven-settings.xml -Dmaven.repo.local="${FRESH_REPO}" --batch-mode --no-transfer-progress dependency:get -Dartifact=com.empresa.platform:platform-libraries-bom:1.1.0:pom -Dtransitive=false
