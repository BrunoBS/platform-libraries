name: Fresh package resolution probe

on:
  push:
    branches:
      - refactor/consolidate-foundation-repositories

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Create standalone Maven probe
        run: |
          cat > "${RUNNER_TEMP}/probe-pom.xml" <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>probe</groupId>
            <artifactId>foundation-remote-probe</artifactId>
            <version>1</version>
          </project>
          EOF

      - name: Resolve structural artifacts from registry only
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FRESH_REPO="${RUNNER_TEMP}/foundation-m2"
          rm -rf "${FRESH_REPO}"
          MVN="mvn -U -f ${RUNNER_TEMP}/probe-pom.xml --settings .github/maven-settings.xml -Dmaven.repo.local=${FRESH_REPO} --batch-mode --no-transfer-progress"
          ${MVN} dependency:get -Dartifact=com.empresa.platform:platform-dependencies:1.0.3:pom -Dtransitive=false
          ${MVN} dependency:get -Dartifact=com.empresa.platform:platform-parent:1.1.0:pom -Dtransitive=false
          ${MVN} dependency:get -Dartifact=com.empresa.platform:platform-libraries-bom:1.1.0:pom -Dtransitive=false
