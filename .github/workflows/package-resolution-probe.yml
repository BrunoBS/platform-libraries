name: Package resolution probe

on:
  push:
    branches:
      - refactor/consolidate-foundation-repositories

permissions:
  contents: read
  packages: read

jobs:
  resolve-platform-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve platform-dependencies 1.0.3 from consolidated registry
        env:
          GITHUB_PACKAGES_USERNAME: BrunoBS
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN }}
        run: mvn --settings .github/maven-settings.xml --batch-mode --no-transfer-progress dependency:get -Dartifact=com.empresa.platform:platform-dependencies:1.0.3:pom -Dtransitive=false
