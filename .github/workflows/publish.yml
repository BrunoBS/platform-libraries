name: Publish Maven packages

on:
  workflow_dispatch:

concurrency:
  group: platform-libraries-maven-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify and publish
        env:
          GITHUB_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --settings .github/maven-publish-settings.xml --batch-mode --no-transfer-progress --strict-checksums -Dmaven.repo.local="${RUNNER_TEMP}/platform-release-m2" -DdeployAtEnd=true clean deploy

      - name: Record release provenance
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/platform-release-evidence"
          git rev-parse HEAD > "${RUNNER_TEMP}/platform-release-evidence/source-commit.txt"
          cp .mvn/maven.config "${RUNNER_TEMP}/platform-release-evidence/maven.config"
          mvn --version > "${RUNNER_TEMP}/platform-release-evidence/toolchain.txt"
          find . -type f \( -path '*/target/*.jar' -o -name '.flattened-pom.xml' \) -exec sha256sum {} \; | sort > "${RUNNER_TEMP}/platform-release-evidence/artifact-sha256.txt"

      - name: Upload release provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-${{ github.run_id }}
          path: ${{ runner.temp }}/platform-release-evidence/
          retention-days: 30
