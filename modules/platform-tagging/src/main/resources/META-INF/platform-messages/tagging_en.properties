tag.name.invalid=TAG-0001|400|The tag name is invalid after normalization.|Provide a tag name containing at least one letter or digit and no more than 150 characters after normalization.
tag.origin.required=TAG-0002|400|The tag origin is required.|Provide MANUAL or SYSTEM.
owner.invalid=TAG-0003|400|The tag owner is invalid.|Use a persisted owner with non-null id and identifier values and a non-blank identifier.
