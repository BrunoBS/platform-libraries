tag.name.invalid=TAG-0001|400|The tag name is invalid after normalization.|Provide a tag name containing at least one letter or digit and no more than 150 characters after normalization.
tag.origin.required=TAG-0002|400|The tag origin is required.|Provide MANUAL or SYSTEM.
owner.invalid=TAG-0003|400|The tag owner is invalid.|Use a persisted owner with non-null id and identifier values and a non-blank identifier.
error.factory-result.invalid=TAG-0102|500|TagFactory did not create a tag entity.|Ensure the factory returns one tag entity for every desired tag.
error.persisted-state.invalid=TAG-0103|500|Persisted tagging state is invalid.|Inspect the owner tag rows and repair missing required fields.
error.persisted-name.invalid=TAG-0104|500|A persisted tag name is invalid after normalization.|Correct the stored name so it normalizes to a non-empty value within the supported length.
