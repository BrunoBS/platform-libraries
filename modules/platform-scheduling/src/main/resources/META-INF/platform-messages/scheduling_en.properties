PLT-SCHED-001|200|Distributed scheduling lock is disabled; tasks are uncoordinated.|Enable golden.scheduling.distributed-lock.enabled to coordinate service instances.
PLT-SCHED-002|500|Distributed scheduling lock Redis is unavailable.|Check the Redis connection; scheduled executions are skipped while it is unavailable.
PLT-SCHED-003|500|Distributed scheduling lock configuration is invalid.|Review golden.scheduling.distributed-lock and spring.application.name.
