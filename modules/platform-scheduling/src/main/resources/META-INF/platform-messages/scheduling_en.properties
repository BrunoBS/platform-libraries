PLT-SCHED-001|200|Distributed scheduling lock is disabled; tasks are uncoordinated.|Enable golden.scheduling.distributed-lock.enabled to coordinate service instances.
PLT-SCHED-002|500|Distributed scheduling lock Redis is unavailable.|Check the Redis connection; scheduled executions are skipped while it is unavailable.
PLT-SCHED-003|500|Distributed scheduling lock configuration is invalid.|Review golden.scheduling.distributed-lock and spring.application.name.
PLT-SCHED-004|500|A stable distributed-lock identity could not be determined for the scheduled task.|Use PlatformTaskScheduler with a stable task name, or a Spring @Scheduled method with a stable class and method name.
PLT-SCHED-005|500|A reactive @Scheduled method returned null.|Return a non-null reactive Publisher from every reactive @Scheduled method.
PLT-SCHED-006|500|The platform task scheduler is not initialized.|Use PlatformTaskScheduler from an application context with platform scheduling enabled.
