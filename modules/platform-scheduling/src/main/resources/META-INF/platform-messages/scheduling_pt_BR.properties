lock.disabled=PLT-SCHED-001|200|O lock distribuído do scheduler está desabilitado; as tarefas não estão coordenadas.|Habilite golden.scheduling.distributed-lock.enabled para coordenar as instâncias do serviço.
redis.unavailable=PLT-SCHED-002|500|O Redis do lock distribuído do scheduler está indisponível.|Verifique a conexão Redis; as execuções agendadas são descartadas enquanto ele estiver indisponível.
configuration.invalid=PLT-SCHED-003|500|A configuração do lock distribuído do scheduler é inválida.|Revise golden.scheduling.distributed-lock e spring.application.name.
task.identity.unavailable=PLT-SCHED-004|500|Não foi possível determinar uma identidade estável de lock distribuído para a tarefa agendada.|Use PlatformTaskScheduler com um nome estável ou um método Spring @Scheduled com classe e método estáveis.
reactive.task.returned-null=PLT-SCHED-005|500|Um método reativo @Scheduled retornou null.|Retorne um Publisher reativo não nulo em todos os métodos reativos @Scheduled.
task.scheduler.not-initialized=PLT-SCHED-006|500|O scheduler de tarefas da plataforma não foi inicializado.|Use PlatformTaskScheduler em um contexto de aplicação com o scheduling da plataforma habilitado.
