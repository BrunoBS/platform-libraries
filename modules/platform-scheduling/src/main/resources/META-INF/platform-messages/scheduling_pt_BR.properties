PLT-SCHED-001|200|O lock distribuído do scheduler está desabilitado; as tarefas não estão coordenadas.|Habilite golden.scheduling.distributed-lock.enabled para coordenar as instâncias do serviço.
PLT-SCHED-002|500|O Redis do lock distribuído do scheduler está indisponível.|Verifique a conexão Redis; as execuções agendadas são descartadas enquanto ele estiver indisponível.
PLT-SCHED-003|500|A configuração do lock distribuído do scheduler é inválida.|Revise golden.scheduling.distributed-lock e spring.application.name.
PLT-SCHED-004|200|As métricas do lock distribuído não são exportadas porque não há MeterRegistry configurado.|Configure um Micrometer MeterRegistry se precisar exportar métricas do lock.
