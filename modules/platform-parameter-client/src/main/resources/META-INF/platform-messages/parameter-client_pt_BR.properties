operator.invalid=PLT-PARAM-008|422|Operador de expressão não suportado.|Utilize um operador V1 suportado.
input.incompatible=PLT-PARAM-009|422|Tipo de entrada incompatível com a expressão.|Informe entrada exata compatível com valueType.
