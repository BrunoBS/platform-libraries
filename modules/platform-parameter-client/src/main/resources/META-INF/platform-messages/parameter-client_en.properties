validation=PLT-PARAM-001|400|Invalid parameter lookup arguments.|Provide a complete logical key and a concrete type; null or complex defaults require an explicit type.
read.failed=PLT-PARAM-002|503|Published parameter storage is unavailable.|Review Redis connectivity and access permissions.
value.invalid=PLT-PARAM-003|422|Published parameter JSON or requested type is invalid.|Review the published envelope and the concrete requested type; JSON null is not supported.
timeout=PLT-PARAM-004|504|Published parameter lookup timed out.|Review Redis latency and connection timeouts.
missing=PLT-PARAM-006|404|Published expression is absent.|Publish the parameter or supply an explicit fallback.
expression.invalid=PLT-PARAM-007|422|Published expression does not match the V1 schema.|Review the published expression contract.
operator.invalid=PLT-PARAM-008|422|Expression operator is unsupported.|Use a supported V1 operator.
input.incompatible=PLT-PARAM-009|422|Expression input type is incompatible.|Supply an exact supported input matching valueType.
