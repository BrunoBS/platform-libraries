publish.failed=PLT-MQ-002|500|Failed to publish a message to destination {0}.|Check the broker availability, destination configuration and application permissions.
publisher.disabled=PLT-MQ-003|500|Publishing is disabled for destination {0}.|Enable publishing for the destination or update the service configuration.
serialization.failed=PLT-MQ-004|500|The message payload could not be serialized.|Check the payload type and its serialization configuration.
deserialization.failed=PLT-MQ-005|500|The received message payload could not be deserialized.|Check the message format and compatibility between the producer and consumer.
listener.invocation.failed=PLT-MQ-006|500|The message listener for destination {0} could not be invoked.|Check the listener method signature and Spring proxy configuration.
publish.options.unsupported=PLT-MQ-007|400|The configured publisher does not support ordered publish options.|Use a publisher that supports ordering and deduplication, or omit these options.
publish.options.invalid=PLT-MQ-008|400|Invalid publish options for destination {0}.|Check that ordering and deduplication options are supported by the configured provider and queue.
publish.payload.invalid=PLT-MQ-009|400|Message payload must not be null.|Provide a non-null payload that represents the message body.
