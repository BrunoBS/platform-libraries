destination.required=AUD-500-001|500|Destino da fila de auditoria não configurado.|Defina platform.audit.destination com um destino lógico configurado em platform.message-queue.destinations.
destination.not-configured=AUD-500-002|500|O destino de auditoria precisa estar configurado para publicação ordenada.|Configure o destino com ordered=true e publisher.enabled=true.
context.user.missing=AUD-500-003|500|Contexto autorizado do usuário não disponível para auditoria.|Garanta que platform-authorization tenha validado a requisição antes da auditoria.
resource.identifier.missing=AUD-500-004|500|Não foi possível resolver o identificador do recurso para auditoria.|Verifique o campo resourceId e sua origem na anotação @Auditable.
field.not-allowed=AUD-500-005|500|O campo selecionado foi bloqueado pela política de minimização de dados.|Remova campos sensíveis e permita somente cabeçalhos aprovados.
resource-action.required=AUD-500-006|500|O recurso e a ação auditados não podem estar vazios.|Informe valores não vazios em resource e action na anotação @Auditable.
event.too-large=AUD-500-007|500|O evento de auditoria excede o limite de tamanho configurado.|Reduza os campos permitidos ou ajuste platform.audit.max-event-size-bytes.
event.serialization-failed=AUD-500-008|500|Não foi possível serializar o evento de auditoria.|Verifique os campos e valores do evento.
events-per-invocation.exceeded=AUD-500-009|500|A coleção excede o limite de eventos por chamada.|Reduza a coleção de retorno ou ajuste platform.audit.max-events-per-invocation.
field.resolve-failed=AUD-500-010|500|Não foi possível ler o campo de auditoria configurado.|Verifique se o campo selecionado existe na origem configurada.
publish.failed=AUD-500-011|500|Não foi possível publicar o evento de auditoria na fila.|Verifique o destino da fila, a disponibilidade do broker e a configuração do publisher.
