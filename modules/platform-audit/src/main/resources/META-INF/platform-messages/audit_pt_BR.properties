context.user.missing=AUD-500-003|500|Contexto autorizado do usuário não disponível para auditoria.|Garanta que platform-authorization tenha validado a requisição antes da auditoria.
resource.identifier.missing=AUD-500-004|500|Não foi possível resolver o identificador do recurso no snapshot.|Retorne um objeto auditável com o campo identifier ou id.
event-definition.required=AUD-500-012|500|O tipo de recurso e o evento de auditoria são obrigatórios.|Informe resourceType e event na anotação @Auditable.
snapshot.required=AUD-500-013|500|A operação auditável não produziu um snapshot JSON válido.|Retorne o estado do recurso após a operação ou configure o snapshot anterior para purge.
transaction.required=AUD-500-014|500|A operação auditável precisa executar dentro de uma transação ativa.|Adicione @Transactional ao Service ou Use Case que declara @Auditable.
before-snapshot.provider-required=AUD-500-015|500|A captura anterior ao purge não possui um provedor de snapshot configurado.|Implemente AuditBeforeSnapshotProvider no serviço produtor.
custom-action.not-configured=AUD-500-016|500|A ação CUSTOM ainda não possui uma estratégia de captura configurada.|Use uma AuditAction conhecida ou defina o contrato de captura CUSTOM antes de habilitá-la.
event.too-large=AUD-500-007|500|O snapshot e o metadata excedem o limite de tamanho configurado.|Reduza o estado retornado ou ajuste platform.audit.max-event-size-bytes.
event.serialization-failed=AUD-500-008|500|Não foi possível serializar o snapshot ou metadata da auditoria.|Verifique os valores retornados pelo caso de uso.
events-per-invocation.exceeded=AUD-500-009|500|A coleção excede o limite de eventos por chamada.|Reduza a coleção de retorno ou ajuste platform.audit.max-events-per-invocation.
