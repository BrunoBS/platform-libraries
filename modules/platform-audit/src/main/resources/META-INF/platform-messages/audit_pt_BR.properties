service-url.required=AUD-500-001|500|URL do serviço de auditoria não configurada.|Configure a propriedade platform.audit.service-url.
context.user.missing=AUD-500-002|500|Contexto autorizado do usuário não disponível para auditoria.|Garanta que platform-authorization tenha validado a requisição antes da auditoria.
queue.missing=AUD-500-003|500|A fila de eventos de auditoria é obrigatória para entrega assíncrona.|Configure Redis ou forneça um bean AuditEventQueue.
queue.redis.not-configured=AUD-500-004|500|Redis não configurado para a fila de eventos de auditoria.|Configure StringRedisTemplate ou desabilite platform.audit.queue.enabled ao usar entrega síncrona estrita.
queue.persist.failed=AUD-500-005|500|Falha ao persistir evento na fila de auditoria.|Verifique a disponibilidade e a configuração da fila de auditoria.
queue.deserialize.failed=AUD-500-006|500|Falha ao desserializar evento da fila de auditoria.|Verifique a integridade dos eventos pendentes na fila de auditoria.
