service-url.required=AUD-500-001|500|Audit service URL is not configured.|Configure the platform.audit.service-url property.
context.user.missing=AUD-500-002|500|Authorized user context is not available for auditing.|Ensure platform-authorization validates the request before auditing.
queue.missing=AUD-500-003|500|Audit event queue is required for asynchronous delivery.|Configure Redis or provide an AuditEventQueue bean.
queue.redis.not-configured=AUD-500-004|500|Redis is not configured for the audit event queue.|Configure StringRedisTemplate or disable platform.audit.queue.enabled when using strict synchronous delivery.
queue.persist.failed=AUD-500-005|500|Failed to persist the audit event in the queue.|Check audit queue availability and configuration.
queue.deserialize.failed=AUD-500-006|500|Failed to deserialize an audit event from the queue.|Check the integrity of pending events in the audit queue.
