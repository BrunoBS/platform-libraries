context.user.missing=AUD-500-003|500|The authorized user context required for audit is unavailable.|Ensure platform-authorization validated the request before auditing.
resource.identifier.missing=AUD-500-004|500|The resource identifier could not be resolved from the snapshot.|Return an auditable object containing the identifier or id field.
event-definition.required=AUD-500-012|500|The audit resource type and event are required.|Set resourceType and event on the @Auditable annotation.
snapshot.required=AUD-500-013|500|The auditable operation did not produce a valid JSON snapshot.|Return the resource state after the operation or configure the before snapshot for purge.
transaction.required=AUD-500-014|500|The auditable operation must run inside an active transaction.|Add @Transactional to the Service or Use Case declaring @Auditable.
before-snapshot.provider-required=AUD-500-015|500|No provider is configured to capture the snapshot before purge.|Implement AuditBeforeSnapshotProvider in the producing service.
custom-action.not-configured=AUD-500-016|500|The CUSTOM action does not have a capture strategy configured yet.|Use a known AuditAction or define the CUSTOM capture contract before enabling it.
event.too-large=AUD-500-007|500|The audit snapshot and metadata exceed the configured size limit.|Reduce the returned state or adjust platform.audit.max-event-size-bytes.
event.serialization-failed=AUD-500-008|500|The audit snapshot or metadata could not be serialized.|Check the values returned by the use case.
events-per-invocation.exceeded=AUD-500-009|500|The collection exceeds the event limit for one invocation.|Reduce the returned collection or adjust platform.audit.max-events-per-invocation.
