destination.required=AUD-500-001|500|Audit message queue destination is not configured.|Set platform.audit.destination to a logical destination configured in platform.message-queue.destinations.
destination.not-configured=AUD-500-002|500|The audit destination must be configured for ordered publishing.|Configure the destination with ordered=true and publisher.enabled=true.
context.user.missing=AUD-500-003|500|Authorized user context is not available for auditing.|Ensure platform-authorization validates the request before auditing.
resource.identifier.missing=AUD-500-004|500|The resource identifier could not be resolved for auditing.|Check the @Auditable resourceId field and its source.
field.not-allowed=AUD-500-005|500|The selected audit field is blocked by the data-minimization policy.|Remove sensitive fields and allow only approved headers.
resource-action.required=AUD-500-006|500|The audited resource and action must not be blank.|Set non-empty resource and action values in @Auditable.
event.too-large=AUD-500-007|500|The audit event exceeds the configured size limit.|Reduce the allowlisted payload or configure platform.audit.max-event-size-bytes.
event.serialization-failed=AUD-500-008|500|The audit event could not be serialized.|Check the configured fields and event values.
events-per-invocation.exceeded=AUD-500-009|500|The audit collection exceeds the configured event limit.|Reduce the result collection or configure platform.audit.max-events-per-invocation.
field.resolve-failed=AUD-500-010|500|The configured audit field could not be read.|Check that the selected field is available in its configured source.
