service-url.required=AUD-500-001|500|Audit service URL is not configured.|Configure the platform.audit.service-url property.
context.user.missing=AUD-500-002|500|Authorized user context is not available for auditing.|Ensure platform-authorization validates the request before auditing.
fallback.store.missing=AUD-500-003|500|Audit fallback is enabled without a configured store.|Configure Redis or provide an AuditFallbackStore bean.
fallback.redis.not-configured=AUD-500-004|500|Redis is not configured for audit fallback.|Configure StringRedisTemplate or disable platform.audit.fallback.enabled.
fallback.persist.failed=AUD-500-005|500|Failed to persist the audit event in fallback storage.|Check fallback storage availability and configuration.
fallback.deserialize.failed=AUD-500-006|500|Failed to deserialize an audit event from fallback storage.|Check the integrity of pending events in fallback storage.
