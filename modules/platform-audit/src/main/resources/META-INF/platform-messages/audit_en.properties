destination.required=AUD-500-001|500|Audit message queue destination is not configured.|Set platform.audit.destination to a logical destination configured in platform.message-queue.destinations.
destination.not-configured=AUD-500-002|500|The audit destination must be configured for ordered publishing.|Configure the destination with ordered=true and publisher.enabled=true.
context.user.missing=AUD-500-003|500|Authorized user context is not available for auditing.|Ensure platform-authorization validates the request before auditing.
