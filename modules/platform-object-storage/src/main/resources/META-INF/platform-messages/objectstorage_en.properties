object.not-found=PLT-OS-002|404|Object was not found.|Check the logical destination, object key, and optional version identifier.
object.already-exists=PLT-OS-003|409|An object already exists at the requested destination and key.|Use OVERWRITE only when replacing the current object is intended.
access.denied=PLT-OS-004|403|Access to the object storage resource was denied.|Review the selected provider credentials and least-privilege permissions.
unauthorized=PLT-OS-008|401|Object storage credentials were not accepted.|Review the identity and authentication configuration for the selected provider.
operation.timeout=PLT-OS-009|504|Object storage operation {0} timed out.|Retry according to the application timeout and retry policy.
operation.transient-failure=PLT-OS-005|503|Object storage operation {0} failed due to a temporary provider error.|Retry according to the application retry policy.
operation.failed=PLT-OS-006|500|Object storage operation {0} failed.|Review the provider response and configuration.
request.invalid=PLT-OS-007|400|Object storage request field {0} is invalid.|Provide a valid logical destination, key, version, page size, or upload request.
