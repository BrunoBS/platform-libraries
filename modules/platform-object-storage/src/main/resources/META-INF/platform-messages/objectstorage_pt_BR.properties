object.not-found=PLT-OS-002|404|O objeto não foi encontrado.|Verifique o destino lógico, a chave do objeto e a versão opcional.
object.already-exists=PLT-OS-003|409|Já existe um objeto no destino e chave informados.|Use OVERWRITE somente quando a substituição do objeto atual for intencional.
access.denied=PLT-OS-004|403|O acesso ao recurso de armazenamento foi negado.|Verifique as credenciais do provedor selecionado e as permissões mínimas necessárias.
unauthorized=PLT-OS-008|401|As credenciais de armazenamento não foram aceitas.|Verifique a identidade e a configuração de autenticação do provedor selecionado.
operation.timeout=PLT-OS-009|504|A operação de armazenamento {0} excedeu o tempo limite.|Tente novamente conforme os limites de tempo e a política de retry da aplicação.
operation.transient-failure=PLT-OS-005|503|A operação de armazenamento {0} falhou devido a um erro temporário do provedor.|Tente novamente conforme a política de retry da aplicação.
operation.failed=PLT-OS-006|500|A operação de armazenamento {0} falhou.|Verifique a resposta e a configuração do provedor.
request.invalid=PLT-OS-007|400|O campo {0} da solicitação de armazenamento é inválido.|Informe destino lógico, chave, versão, tamanho de página e dados de upload válidos.
