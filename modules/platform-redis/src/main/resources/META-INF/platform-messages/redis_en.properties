validation=PLT-REDIS-001|400|Invalid Redis operation parameters.|Review keys, values, durations and limits.
unavailable=PLT-REDIS-002|503|Redis is unavailable.|Check the Redis connection.
timeout=PLT-REDIS-003|504|Redis operation timed out.|Check latency and timeouts.
authentication=PLT-REDIS-004|503|Redis authentication failed.|Review Redis credentials and permissions.
type=PLT-REDIS-005|409|Incompatible native Redis type.|Use the appropriate Redis operation.
serialization=PLT-REDIS-006|422|Redis JSON serialization or target type is invalid.|Review JSON and the requested type.
builder.used=PLT-REDIS-007|409|Redis write builder has already been executed.|Create a new write operation.
configuration=PLT-REDIS-008|500|Invalid Platform Redis configuration.|Review Redis properties.
listener=PLT-REDIS-009|500|Redis listener processing failed.|Inspect listener health and application metrics.
limit=PLT-REDIS-010|413|Redis configured limit exceeded.|Reduce payload or result size.
saturation=PLT-REDIS-011|503|Redis listener capacity exceeded.|Review listener capacity.

cache.types.invalid=PLT-REDIS-012|500|Redis cache return types are unresolved or incompatible.|Declare concrete return types and separate cache regions for incompatible types.
cache.sync.transaction=PLT-REDIS-013|500|Synchronized Redis cache loading is not supported inside an active transaction.|Use sync=false for transactional methods.
