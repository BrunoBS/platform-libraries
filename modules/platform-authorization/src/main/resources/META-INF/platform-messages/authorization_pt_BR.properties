group.missing=AUTH-403-002|403|Grupo de autorização obrigatório não encontrado.|Solicite acesso ao grupo necessário para a operação.
owner.required=AUTH-403-003|403|Permissão de OWNER é obrigatória.|Solicite permissão de OWNER para executar esta operação.
resource.access.denied=AUTH-403-004|403|Acesso ao recurso não permitido.|Verifique suas permissões para o recurso solicitado.
platform.access.denied=AUTH-401-004|401|Acesso não permitido|Verifique suas credenciais e tente novamente.
