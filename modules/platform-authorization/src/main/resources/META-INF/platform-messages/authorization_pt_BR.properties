correlation-id.missing=AUTH-401-001|401|Correlation ID não informado.|Informe o cabeçalho X-Correlation-Id.
token.missing=AUTH-401-002|401|Token de autorização não informado.|Informe um token Bearer válido.
session.not.found=AUTH-401-003|401|Sessão de usuário não encontrada.|Autentique-se novamente e repita a operação.
