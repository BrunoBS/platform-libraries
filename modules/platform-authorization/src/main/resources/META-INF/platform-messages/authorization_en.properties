correlation-id.missing=AUTH-401-001|401|Correlation ID was not provided.|Provide the X-Correlation-Id header.
token.missing=AUTH-401-002|401|Authorization token was not provided.|Provide a valid Bearer token.
session.not.found=AUTH-401-003|401|User session was not found.|Authenticate again and retry the operation.
