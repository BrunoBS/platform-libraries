owner.required=AUTH-403-003|403|OWNER permission is required.|Request OWNER permission to perform this operation.
resource.access.denied=AUTH-403-004|403|Access to the resource is not allowed.|Check your permissions for the requested resource.
platform.access.denied=AUTH-401-004|401|Access denied|Check your credentials and try again.
