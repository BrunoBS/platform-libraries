service-url.required=AUD-500-001|500|URL do servi\u00e7o de auditoria n\u00e3o configurada.|Configure a propriedade platform.audit.service-url.
context.user.missing=AUD-500-002|500|Contexto autorizado do usu\u00e1rio n\u00e3o dispon\u00edvel para auditoria.|Garanta que platform-authorization tenha validado a requisi\u00e7\u00e3o antes da auditoria.
fallback.store.missing=AUD-500-003|500|Fallback de auditoria habilitado sem armazenamento configurado.|Configure Redis ou forne\u00e7a um bean AuditFallbackStore.
fallback.redis.not-configured=AUD-500-004|500|Redis n\u00e3o configurado para o fallback de auditoria.|Configure StringRedisTemplate ou desabilite platform.audit.fallback.enabled.
fallback.persist.failed=AUD-500-005|500|Falha ao persistir evento de auditoria no fallback.|Verifique a disponibilidade e a configura\u00e7\u00e3o do armazenamento de fallback.
fallback.deserialize.failed=AUD-500-006|500|Falha ao desserializar evento de auditoria armazenado no fallback.|Verifique a integridade dos eventos pendentes no armazenamento de fallback.
